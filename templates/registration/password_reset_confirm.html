{% extends 'base.html' %}

{% block title %}Set New Password - OvernightApp{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">Set New Password</h2>

                    {% if validlink %}
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="id_new_password1" class="form-label">New Password</label>
                            <input type="password" name="new_password1" class="form-control" id="id_new_password1" required>
                        </div>

                        <div class="mb-3">
                            <label for="id_new_password2" class="form-label">Confirm New Password</label>
                            <input type="password" name="new_password2" class="form-control" id="id_new_password2" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Reset Password</button>
                        </div>
                    </form>
                    {% else %}
                    <div class="alert alert-danger">
                        <p>The password reset link is invalid or has expired.</p>
                    </div>
                    <div class="text-center">
                        <a href="{% url 'users:password_reset' %}" class="btn btn-primary">Request New Reset Link</a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
