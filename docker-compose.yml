services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overnight_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "16292:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - overnight_network

  redis:
    image: redis:7-alpine
    container_name: overnight_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - overnight_network

volumes:
  static_volume:
  redis_data:

networks:
  overnight_network:
    driver: bridge
