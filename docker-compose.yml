services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overnight_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "16292:8000"
    env_file:
      - .env
    environment:
      - DOCKER_CONTAINER=true
    restart: unless-stopped
    networks:
      - overnight_network

volumes:
  static_volume:

networks:
  overnight_network:
    driver: bridge
